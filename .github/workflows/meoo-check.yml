name: Meoo adapter checks
on:
  push:
    branches: [feat/meoo-fullstack-adapter]
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/meoo-check.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify Meoo deployment scripts
        run: |
          bash -n scripts/setup.sh
          bash -n scripts/start.sh
          test -f db/meoo-schema.sql
          test -f docs/meoo-migration.md
